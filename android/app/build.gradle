plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.chaquo.python'
}

android {
    namespace 'com.mouya.qbotds'
    compileSdk 37

    defaultConfig {
        applicationId 'com.mouya.qbotds'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1.0'

        ndk {
            // Python 3.12+ only ships 64-bit ABIs.
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

chaquopy {
    defaultConfig {
        // Pure standard library bot: no pip requirements, so CI needs no host
        // Python packages. buildPython only locates the interpreter itself.
        version = '3.12'
        buildPython = System.getenv('CHAQUOPY_BUILD_PYTHON') ?: 'python3'
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.9.4'
}