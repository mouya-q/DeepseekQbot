name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13.2'

      - name: Verify Python syntax
        run: |
          cd bot
          python3 -m py_compile config.py ai_engine.py ws_client.py onebot.py main.py supervisor.py dsha-responder.py dsha-watcher.py morning-report.py
          echo "Python syntax OK"
          cd ../
          python3 -m py_compile panel_server.py
          echo "Panel syntax OK"

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepseekQbot-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30