name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKM" || SDKM="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          "$SDKM" --list_installed 2>/dev/null | grep -E "platforms;android-37" || true
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true

      - name: Verify Python syntax
        run: |
          cd bot
          python3 -m py_compile config.py ai_engine.py ws_client.py onebot.py main.py supervisor.py dsha-responder.py dsha-watcher.py morning-report.py
          echo "Python syntax OK"
          cd ../
          python3 -m py_compile panel_server.py
          echo "Panel syntax OK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepseekQbot-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30